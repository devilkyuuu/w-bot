name: Build Portable Windows Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      TELEGRAM_BOT_API_COMMIT: adfd7f6a8e990272851777eeb3ae0def4216f161
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-02-28-12-59/ffmpeg-n8.0.1-66-g27b8d1a017-win64-lgpl-8.0.zip
      FFMPEG_SHA256: EF2B1179F226C7A953675623BFF13E38ECD806A425F6F229E44660ABDCD0C077

    steps:
      - name: Check out W Bot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache vcpkg binary archives
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: .windows-build/vcpkg-archives
          key: vcpkg-windows-telegram-api-adfd7f6a8e990272851777eeb3ae0def4216f161

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install ".[dev,windows-build]"

      - name: Run non-live tests
        shell: pwsh
        run: python -m pytest -m "not live"

      - name: Run Ruff
        shell: pwsh
        run: python -m ruff check .

      - name: Run strict mypy
        shell: pwsh
        run: python -m mypy src/wbot

      - name: Fetch pinned Telegram Bot API source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .windows-build -Force | Out-Null
          git init .windows-build/telegram-bot-api-source
          git -C .windows-build/telegram-bot-api-source remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C .windows-build/telegram-bot-api-source fetch --depth 1 origin $env:TELEGRAM_BOT_API_COMMIT
          git -C .windows-build/telegram-bot-api-source checkout --detach FETCH_HEAD
          git -C .windows-build/telegram-bot-api-source submodule update --init --recursive --depth 1

      - name: Verify Telegram source commit
        shell: pwsh
        run: |
          Push-Location .windows-build/telegram-bot-api-source
          try {
            $ActualCommit = (git rev-parse HEAD).Trim()
            git rev-parse HEAD
            if ($ActualCommit -ne $env:TELEGRAM_BOT_API_COMMIT) {
              throw "Telegram source commit verification failed."
            }
          } finally {
            Pop-Location
          }

      - name: Install Telegram build dependencies
        shell: pwsh
        run: |
          $VcpkgCache = Join-Path $pwd '.windows-build\vcpkg-archives'
          New-Item -ItemType Directory -Path $VcpkgCache -Force | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$VcpkgCache" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            gperf:x64-windows `
            openssl:x64-windows-static `
            zlib:x64-windows-static

      - name: Build Telegram Bot API
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\tools\gperf;$env:PATH"
          cmake -S .windows-build/telegram-bot-api-source -B .windows-build/telegram-bot-api-build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_INSTALL_PREFIX="$pwd/.windows-build/telegram-bot-api-install"
          cmake --build .windows-build/telegram-bot-api-build --config Release --target install --parallel 2

      - name: Download FFmpeg archive
        shell: pwsh
        run: |
          $Archive = Join-Path $pwd '.windows-build\ffmpeg.zip'
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile $Archive

      - name: Verify FFmpeg archive
        shell: pwsh
        run: |
          $Archive = Join-Path $pwd '.windows-build\ffmpeg.zip'
          $ActualHash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash
          if ($ActualHash -ne $env:FFMPEG_SHA256) {
            throw "FFmpeg checksum verification failed."
          }
          Expand-Archive -LiteralPath $Archive -DestinationPath .windows-build/ffmpeg -Force

      - name: Build W Bot executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean `
            --distpath .windows-build/bot-dist `
            --workpath .windows-build/pyinstaller-work `
            packaging/windows/w-bot.spec

      - name: Assemble portable package
        shell: pwsh
        run: |
          & .\packaging\windows\assemble-package.ps1 `
            -BotDist .windows-build/bot-dist/w-bot `
            -TelegramApi .windows-build/telegram-bot-api-install/bin/telegram-bot-api.exe `
            -FfmpegRoot .windows-build/ffmpeg `
            -Output .windows-build/package

      - name: Verify portable package
        shell: pwsh
        run: |
          & .\packaging\windows\verify-package.ps1 `
            -PackageRoot .windows-build/package/W-Bot

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .windows-build/artifacts -Force | Out-Null
          $Zip = Join-Path $pwd '.windows-build\artifacts\w-bot-windows-x64.zip'
          Compress-Archive -LiteralPath .windows-build/package/W-Bot -DestinationPath $Zip
          Get-FileHash -LiteralPath $Zip -Algorithm SHA256 | Format-List

      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: w-bot-windows-x64
          path: .windows-build/artifacts/w-bot-windows-x64.zip
          retention-days: 30
          if-no-files-found: error
