[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-w-media-bot"
version = "0.1.0"
description = "Private Telegram /w media bot"
requires-python = ">=3.11,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<0.29",
  "python-telegram-bot>=22.8,<23",
  "yt-dlp>=2026.7.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.16,<0.17",
]

[project.scripts]
wbot = "wbot.app:main"
wbot-wispbyte = "wbot.wispbyte:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wbot"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: requires public third-party websites and is excluded from normal CI",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["wbot"]
